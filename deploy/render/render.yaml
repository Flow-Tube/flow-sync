# Render Blueprint. Render mounts disks owned by root, which the non-root image can't write,
# so this uses Render Postgres instead of SQLite on a disk.
services:
  - type: web
    name: flow-sync
    runtime: docker
    dockerfilePath: ./deploy/docker/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /v1/health
    envVars:
      - key: FLOW_SYNC_ADMIN_TOKEN
        generateValue: true
      - key: FLOW_SYNC_TRUST_PROXY
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: flow-sync
          property: connectionString

databases:
  - name: flow-sync
    plan: basic-256mb
