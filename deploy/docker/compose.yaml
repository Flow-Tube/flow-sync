# Flow sync server behind Caddy, which gets HTTPS certificates automatically.
# Set FLOW_SYNC_DOMAIN, put a random admin token of 32+ characters in ./admin_token, then:
#   docker compose up -d

services:
  flow-sync:
    image: ghcr.io/flow-tube/flow-sync:latest
    restart: unless-stopped
    environment:
      FLOW_SYNC_ADMIN_TOKEN_FILE: /run/secrets/admin_token
      FLOW_SYNC_TRUST_PROXY: "1"
    secrets: [admin_token]
    volumes:
      - data:/data
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 100
    mem_limit: 512m
    user: "65532:65532"

  caddy:
    image: caddy:2.11.7-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      FLOW_SYNC_DOMAIN: ${FLOW_SYNC_DOMAIN:?set FLOW_SYNC_DOMAIN to the server's public name}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 100
    mem_limit: 256m

secrets:
  admin_token:
    file: ./admin_token

volumes:
  data:
  caddy_data:
  caddy_config:
