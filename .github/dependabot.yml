version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      development:
        dependency-type: development
      production:
        dependency-type: production
    commit-message:
      prefix: build
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
  - package-ecosystem: docker
    directories: [/deploy/docker]
    schedule:
      interval: weekly
    ignore:
      # Node majors alternate between LTS and short-lived releases; move to a new LTS by hand.
      - dependency-name: node
        update-types: [version-update:semver-major]
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
