name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

env:
  IMAGE: ghcr.io/flow-tube/flow-sync

jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use the commit time for every timestamp in the image
        id: time
        run: echo "epoch=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          SOURCE_DATE_EPOCH: ${{ steps.time.outputs.epoch }}
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true,rewrite-timestamp=true
          provenance: false
          sbom: false
      - name: Record the platform digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          MATRIX_PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p digests
          echo "$DIGEST" > "digests/${MATRIX_PLATFORM//\//-}"
        shell: bash
        working-directory: ${{ runner.temp }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ strategy.job-index }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      digest: ${{ steps.index.outputs.digest }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create the multi-platform image
        id: index
        env:
          DIGESTS: ${{ runner.temp }}/digests
          VERSION: ${{ github.ref_name }}
        run: |
          refs=()
          for file in "$DIGESTS"/*; do refs+=("$IMAGE@$(cat "$file")"); done
          docker buildx imagetools create -t "$IMAGE:${VERSION#v}" -t "$IMAGE:latest" "${refs[@]}"
          digest=$(docker buildx imagetools inspect "$IMAGE:${VERSION#v}" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - name: Sign the image without a long-lived key
        env:
          DIGEST: ${{ steps.index.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.index.outputs.digest }}
          format: spdx-json
          output-file: ${{ runner.temp }}/sbom.spdx.json
          upload-artifact: false
      - name: Attest the SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.index.outputs.digest }}
          sbom-path: ${{ runner.temp }}/sbom.spdx.json
          push-to-registry: true

  reproduce:
    needs: build
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use the commit time for every timestamp in the image
        id: time
        run: echo "epoch=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: rebuild
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          SOURCE_DATE_EPOCH: ${{ steps.time.outputs.epoch }}
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=false,rewrite-timestamp=true
          provenance: false
          sbom: false
          no-cache: true
      - name: Compare with the released digest
        env:
          DIGESTS: ${{ runner.temp }}/digests
          REBUILT: ${{ steps.rebuild.outputs.digest }}
          MATRIX_PLATFORM: ${{ matrix.platform }}
        run: |
          released=$(cat "$DIGESTS/${MATRIX_PLATFORM//\//-}")
          echo "released $released, rebuilt $REBUILT"
          test "$released" = "$REBUILT"
        shell: bash

  release:
    needs: [publish, reproduce]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pin the image in compose.yaml and take the notes from CHANGELOG.md
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
          VERSION: ${{ github.ref_name }}
          OUT: ${{ runner.temp }}
        run: |
          sed "s|$IMAGE:latest|$IMAGE:${VERSION#v}@$DIGEST|" deploy/docker/compose.yaml > "$OUT/compose.yaml"
          grep -qF "$IMAGE:${VERSION#v}@$DIGEST" "$OUT/compose.yaml"
          cp deploy/docker/Caddyfile "$OUT/Caddyfile"
          awk -v h="## ${VERSION#v}" '$0 == h {on = 1; next} /^## / {on = 0} on' CHANGELOG.md > "$OUT/notes.md"
          grep -q . "$OUT/notes.md"
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
          OUT: ${{ runner.temp }}
        run: gh release create "$VERSION" --verify-tag --title "$VERSION" --notes-file "$OUT/notes.md" "$OUT/compose.yaml" "$OUT/Caddyfile"
