name: Feature request
description: Suggest a change to the server, the protocol or the deployment options.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and what stops you today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How it could work. Protocol changes must keep the server zero-knowledge.
    validations:
      required: true
