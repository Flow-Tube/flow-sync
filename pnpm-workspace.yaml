packages:
  - packages/*

minimumReleaseAge: 4320

# None of these install scripts is needed: esbuild and workerd ship their binaries as optional
# dependencies, and the others build optional native speedups for Testcontainers' dependencies.
allowBuilds:
  cpu-features: false
  esbuild: false
  protobufjs: false
  ssh2: false
  workerd: false

# @vercel/blob reaches zod 4.1.11 (GHSA-mrhx-c7xc-m3w5) through @vercel/cli-config; same major, fixed.
overrides:
  "@vercel/cli-config>zod": 4.6.7
